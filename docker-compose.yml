services:
  api:
    image: ${STICK2SERVER_IMAGE:-ghcr.io/mikemequis1/stick2server:latest}
    pull_policy: always
    container_name: stick2server-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PORT: "8090"
      DB_PATH: /data/planner-server.sqlite
    volumes:
      - stick2server-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  stick2server-data:
    name: stick2server-data
